<html>
    <head>
        <title>Multimedia: Image, Video, Audio and YouTube</title>
    </head>
    <body>

        <h3>Image</h3>

        <img src="image.jpg" alt="College campus"
        width="220" height="220">

        <h3>Video</h3>

        <video width="250" controls> <source src="video.mp4" type="video/mp4"> </video>

        <h3>Audio</h3>

        <audio controls> <source src="audio.mp3" type="audio/mpeg"> </audio>

        <h3>YouTube</h3>

        <iframe width="300" height="130" src="https://www.youtube.com/embed/sOnqjkJTMaA" title="YouTube video"> </iframe>

    </body>
</html>
