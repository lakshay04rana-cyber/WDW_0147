<!DOCTYPE html>
<html>
<head>
    <title>Table with Headers, Caption and Footer</title>
</head>
<body>

    <table border="1">
        <caption>Student Marks</caption>

        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Aman</td>
            <td>85</td>
        </tr>

        

    </table>

</body>
</html>
