<html> 
    <head> 
        <title>Hotel Room Booking Form</title> 
    </head> 
    <body> 
        <h1 align="center">Hotel Room Booking Form</h1>
        <form action="#" method="post" align="center">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>  
        <br></br>
        <label for="email">Email:</label> 
        <input type="email" id="email" name="email" required>
        <br></br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br></br>
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin" required>
        <br></br>
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout" required>
        <br></br>  
        <label for="roomtype">Room Type:</label>
        <select id="roomtype" name="roomtype" required>
            <option value="single room">Single</option>
            <option value="double room">Double</option>
            <option value="suite room">Suite</option>
            <option value="deluxe room">Deluxe</option>
        </select>
        <br></br>
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="7" required>
        <br></br>
        <label for="specialrequests">Special Requests:</label>
        <br></br>
        <textarea id="specialrequests" name="specialrequests" rows="7" cols="50"></textarea>
        <br></br>  
        <input type="submit" value="Book Now">
        <input type="reset" value="Reset form">
        </form>
